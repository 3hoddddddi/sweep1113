<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>\$100 Gift Card Offer</title> <meta name="robots" content="noindex,nofollow"> <meta name="format-detection" content="telephone=no"> <style> :root{--brand:#ff9900;--brand-dark:#232f3e;--ink:#111;--muted:#5a6772;--bg:#f6f7f8;--card:#fff;--shadow:0 8px 28px rgba(0,0,0,.08);--radius:16px;--maxw:430px;} *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:var(--ink);background:linear-gradient(#fff,var(--bg));} .wrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16px 12px 24px;} .page{width:100%;max-width:var(--maxw);} .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 18px;overflow:hidden;} .hero{text-align:center;padding:4px 4px 12px;border-bottom:1px solid #eef1f4;} .headline{margin:4px 0 6px;font-size:22px;line-height:1.25;} .headline .highlight{color:var(--brand-dark);font-size:26px;} .amount{margin:6px 0 2px;font-weight:800;color:var(--brand);font-size:28px;letter-spacing:1px;} .subhead{font-size:18px;font-weight:700;color:var(--brand-dark);margin-bottom:6px;} .timer{margin:8px auto 0;color:var(--muted);font-size:14px;} .timer .count strong{color:var(--brand-dark);} .quiz{padding:16px 4px 8px;} .question{font-size:18px;font-weight:700;margin-bottom:12px;text-align:center;} .options{display:grid;gap:10px;} .btn{appearance:none;border:none;border-radius:12px;padding:14px 16px;background:var(--brand);color:#111;font-weight:700;font-size:16px;line-height:1.2;cursor:pointer;box-shadow:0 4px 14px rgba(255,153,0,.25);transition:transform .04s,box-shadow .2s,background .2s,opacity .2s;} .btn:active{transform:translateY(1px);} .btn:focus{outline:2px solid rgba(35,47,62,.35);outline-offset:2px;} .btn:hover{box-shadow:0 6px 18px rgba(255,153,0,.35);} .btn--muted{background:#ffd28a;} /* 底图现在放在白色卡片内部，统一白色背景，不会再出现灰底/白底不一致 */ .footer-visual{margin:14px 0 0;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #eef1f4;} /* 默认：不裁剪，完整显示（高度随图片自适应） */ .footer-visual img{display:block;width:100%;height:auto;background:#fff;} /* 如果你想固定高度且仍不裁剪，可把 figure 加 class="footer-visual contain" */ .footer-visual.contain img{width:100%;height:180px;object-fit:contain;background:#fff;} .legal{margin:8px 4px 0;color:#7a8792;font-size:12px;line-height:1.35;text-align:center;} @media (min-width:480px){.headline{font-size:24px}.headline .highlight{font-size:28px}.amount{font-size:30px}.subhead{font-size:20px}} noscript{display:block;color:#c00;text-align:center;padding:8px 0} </style> </head> <body> <noscript>JavaScript is required for this page to work.</noscript> <div class="wrap"> <main class="page" role="main" aria-labelledby="headline"> <section class="card"> <header class="hero"> <h1 id="headline" class="headline"> <span>You've been selected for a chance to</span> <strong class="highlight">win!</strong> </h1> <div class="amount">-\$100-</div> <div class="subhead">Amazon Gift Card!</div> <p class="timer"> Limited time - don't miss out! <span class="count">Offer ends in <strong id="countdown">03:00</strong></span> </p> </header>

  <section class="quiz" aria-live="polite" aria-atomic="true">

</main> </div> <script> (function(){ "use strict"; try{ var COUNTDOWN_SECONDS = 180; var REDIRECT_URL = "https://www.google.com"; var quiz = [ {q:"How often do you shop on Amazon?", options:["Every week","About once a month","Rarely"]}, {q:"What would you spend \$100 on?", options:["🍔 Snack Time","🐶 Spoil Pets","🛒 Treat Myself"]} ]; var current = 0; var countdown = COUNTDOWN_SECONDS; var timerId = null; var $question = document.getElementById("question"); var $options = document.getElementById("options"); var $countdown = document.getElementById("countdown"); function pad(n){ return n<10?("0"+n):String(n); } function formatTime(s){ var m=Math.floor(s/60), sec=s%60; return pad(m)+":"+pad(sec); } function startTimer(){ $countdown.textContent = formatTime(countdown); timerId = setInterval(function(){ countdown--; if(countdown<=0){ clearInterval(timerId); $countdown.textContent = "00:00"; expire(); return; } $countdown.textContent = formatTime(countdown); },1000); } function expire(){ $question.textContent = "This offer has expired."; $options.innerHTML = ""; var btn = document.createElement("button"); btn.className = "btn btn--muted"; btn.textContent = "Refresh to retry"; btn.onclick = function(){ location.reload(); }; $options.appendChild(btn); } function render(){ var item = quiz[current]; $question.textContent = item.q; $options.innerHTML = ""; item.options.forEach(function(label, idx){ var btn = document.createElement("button"); btn.className = "btn"; btn.type = "button"; btn.setAttribute("aria-label", label); btn.textContent = label; btn.addEventListener("click", function(){ onChoose(idx); }); $options.appendChild(btn); }); } function onChoose(){ if(current===quiz.length-1){ window.location.href = REDIRECT_URL; } else { current++; render(); } } render(); startTimer(); }catch(e){ console.error(e); } })(); </script> </body> </html>
